/* ==========================================================================
   AUDIO ENGINE (SYNTHESIZER)
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.isPlaying = false;
    this.audioElement = null;
    this.bgmTimer = null;
    this.step = 0;
    this.mode = 1;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleBGM() {
    this.init();
    if (this.isPlaying) {
      this.stopBGM();
    } else {
      this.startBGM(this.mode);
    }
    return this.isPlaying;
  }

  startBGM(epNum = 1) {
    this.init();
    this.stopBGM();
    this.mode = epNum;
    this.isPlaying = true;

    if (ASSETS_AUDIO.bgm_main !== "") {
      if (!this.audioElement) {
        this.audioElement = new Audio(ASSETS_AUDIO.bgm_main);
        this.audioElement.loop = true;
      }
      this.audioElement.play();
      return;
    }

    const chordsEp1 = [
      [261.63, 329.63, 392.00], // C
      [220.00, 261.63, 329.63], // Am
      [174.61, 220.00, 261.63], // F
      [196.00, 246.94, 293.66]  // G
    ];

    const chordsEp2 = [
      [220.00, 261.63, 329.63], // Am
      [174.61, 220.00, 261.63], // F
      [130.81, 164.81, 196.00], // C
      [164.81, 196.00, 246.94]  // Em
    ];

    const playNote = () => {
      if (!this.isPlaying) return;
      const now = this.ctx.currentTime;
      const chords = this.mode === 1 ? chordsEp1 : chordsEp2;
      const currentChord = chords[Math.floor(this.step / 4) % chords.length];
      const freq = currentChord[this.step % currentChord.length];

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = this.mode === 1 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.005, now);
      gain.gain.exponentialRampToValueAtTime(0.04, now + 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + 1.8);

      this.step++;
      this.bgmTimer = setTimeout(playNote, 650);
    };

    playNote();
  }

  stopBGM() {
    this.isPlaying = false;
    if (this.bgmTimer) clearTimeout(this.bgmTimer);
    if (this.audioElement) this.audioElement.pause();
  }

  playSFX(type) {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);

    if (type === 'click') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'scan') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(250, now);
      osc.frequency.linearRampToValueAtTime(750, now + 0.2);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'warn') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.setValueAtTime(130, now + 0.08);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    }
  }
}

/* ==========================================================================
   GAME STATE & ENGINE
   ========================================================================== */
const GAME = {
  currentEp: 1,
  state: {
    index: 0,
    score1: 0,
    score2: 50,
    score3: 50,
    history: [],
    inspectionsDone: [],
    dialogueHistory: []
  }
};

const $ = s => document.querySelector(s);

function renderArt(key, altText) {
  if (ASSETS[key] && ASSETS[key].trim() !== "") {
    return `<div class="art-container"><img src="${ASSETS[key]}" alt="${altText}"></div>`;
  }
  return `
    <div class="art-container">
      <div class="placeholder-art">
        <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin:0 auto 6px;display:block;opacity:0.6">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
        </svg>
        <b>[ Tempat Ilustrasi: ${key} ]</b><br>
        <span>${altText}</span>
      </div>
    </div>
  `;
}

function toggleAudio() {
  const active = audio.toggleBGM();
  const btn = $('#audioBtn');
  if (btn) btn.innerText = active ? "🔊 Musik: ON" : "🔇 Musik: OFF";
}

function init() {
  renderTitle();
}

function renderTitle() {
  document.documentElement.style.setProperty('--ep-color', 'var(--accent-blue)');
  $('#app').innerHTML = `
    <div class="card">
      ${renderArt('title_cover', 'Cover Utama Game')}
      <h1>Dilema Moral: Tentukan Hidupmu</h1>
      <p style="color:var(--text-muted)">Game Naratif Interaktif Etika Terapan</p>
      <hr style="border-color:var(--border-color);margin:16px 0">
      
      <h2>Pilih Episode Game</h2>
      <div class="btn-group">
        <button class="choice-btn" onclick="audio.playSFX('click'); startEpisode(1)">
          <b>Episode 1: Utilitarisme — Demi Kebaikan Bersama</b><br>
          <small style="color:var(--text-muted)">Tokoh Utama: Laila (Pengelola Koperasi) | Kalkulus Kebahagiaan</small>
        </button>

        <button class="choice-btn" onclick="audio.playSFX('click'); startEpisode(2)">
          <b>Episode 2: Deontologi — Juru Lupa Kota Sumbra</b><br>
          <small style="color:var(--text-muted)">Tokoh Utama: Marcella (Balai Pelupaan) | Hukum & Kebenaran Mutlak</small>
        </button>
      </div>
    </div>
  `;
}

function startEpisode(epNum) {
  GAME.currentEp = epNum;
  const ep = EPISODES[epNum];
  document.documentElement.style.setProperty('--ep-color', ep.color);

  GAME.state = {
    index: 0,
    score1: epNum === 1 ? 0 : 50,  
    score2: epNum === 1 ? 50 : 100, 
    score3: epNum === 1 ? 50 : 0,   
    history: [],
    inspectionsDone: [],
    dialogueHistory: []
  };

  $('#app').innerHTML = `
    <div class="card">
      ${renderArt(ep.banner, ep.title)}
      <h2>${ep.title}</h2>
      <p><b>Prinsip Utama:</b> <i>"${ep.principle}"</i></p>
      <p>Anda berperan sebagai <b>${ep.hero}</b> (${ep.role}).</p>
      <button class="primary" onclick="audio.playSFX('click'); audio.startBGM(${epNum}); renderScenario()" style="margin-top:10px">
        Mulai Episode (~10 min)
      </button>
    </div>
  `;
}

function renderHUD() {
  const s = GAME.state;
  const epNum = GAME.currentEp;

  if (epNum === 1) {
    return `
      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">Kasus</span>
          <span class="hud-val">${s.index + 1} / 5</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Net Utilitas ($U$)</span>
          <span class="hud-val ${s.score1 < 0 ? 'neg' : ''}">${s.score1 > 0 ? '+' : ''}${s.score1} U</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Warga</span>
          <span class="hud-val">${s.score2}%</span>
        </div>
        <button id="audioBtn" class="sound-btn" onclick="toggleAudio()">
          ${audio.isPlaying ? "🔊 Musik: ON" : "🔇 Musik: OFF"}
        </button>
      </div>
    `;
  } else {
    return `
      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">Tahap</span>
          <span class="hud-val">${s.index + 1} / 5</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Kewajiban ($D$)</span>
          <span class="hud-val">${s.score1}%</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Kebenaran</span>
          <span class="hud-val ${s.score2 < 50 ? 'neg' : ''}">${s.score2}%</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Keraguan</span>
          <span class="hud-val ${s.score3 > 0 ? 'neg' : ''}">${s.score3}x</span>
        </div>
        <button id="audioBtn" class="sound-btn" onclick="toggleAudio()">
          ${audio.isPlaying ? "🔊 Musik: ON" : "🔇 Musik: OFF"}
        </button>
      </div>
    `;
  }
}

function renderScenario() {
  const ep = EPISODES[GAME.currentEp];
  const sc = ep.scenarios[GAME.state.index];
  const s = GAME.state;

  $('#app').innerHTML = `
    ${renderHUD()}
    <div class="card">
      ${renderArt(sc.assetKey, sc.title)}
      <h3>${sc.title}</h3>
      <p style="margin-bottom:16px">${sc.context}</p>

      <h4 style="font-size:0.9rem;color:var(--ep-color);margin-bottom:8px">Penyelidikan & Fakta Lapangan:</h4>
      <div class="log-box" id="logBox">
        <div class="log-entry"><b>Sistem:</b> Pelajari fakta-fakta sebelum mengambil keputusan etika.</div>
        ${s.dialogueHistory.map(d => `<div class="log-entry"><b>${d.label}:</b> ${d.text}</div>`).join('')}
      </div>

      <div class="btn-group" style="flex-direction:row;flex-wrap:wrap">
        <button class="action-btn" onclick="investigate(1)" ${s.inspectionsDone.includes(1) ? 'disabled' : ''}>Pemeriksaan 1</button>
        <button class="action-btn" onclick="investigate(2)" ${s.inspectionsDone.includes(2) ? 'disabled' : ''}>Pemeriksaan 2</button>
        <button class="action-btn" onclick="investigate(3)" ${s.inspectionsDone.includes(3) ? 'disabled' : ''}>Analisis Fakta</button>
      </div>

      <h4 style="font-size:0.9rem;color:var(--accent-amber);margin:20px 0 8px">Tindakan ${ep.hero}:</h4>
      <div class="btn-group">
        <button class="choice-btn" onclick="makeChoice('deontology', 'utilitarian')">
          ${sc.choices.utilitarian ? sc.choices.utilitarian.label : sc.choices.deontology.label}
        </button>
        <button class="choice-btn" onclick="makeChoice('empathy', 'personal')">
          ${sc.choices.personal ? sc.choices.personal.label : sc.choices.empathy.label}
        </button>
        <button class="choice-btn" onclick="makeChoice('hesitate', 'compromise')">
          ${sc.choices.compromise ? sc.choices.compromise.label : sc.choices.hesitate.label}
        </button>
      </div>
    </div>
  `;

  const log = $('#logBox');
  if (log) log.scrollTop = log.scrollHeight;
}

function investigate(num) {
  audio.playSFX('scan');
  const sc = EPISODES[GAME.currentEp].scenarios[GAME.state.index];
  GAME.state.inspectionsDone.push(num);

  const text = sc.details[`investigate_${num}`];
  GAME.state.dialogueHistory.push({ label: `Fakta ${num}`, text });
  renderScenario();
}

function makeChoice(keyEp2, keyEp1) {
  const epNum = GAME.currentEp;
  const key = epNum === 1 ? keyEp1 : keyEp2;
  const sc = EPISODES[epNum].scenarios[GAME.state.index];
  const choice = sc.choices[key];

  if (choice.hesitate) {
    audio.playSFX('warn');
    GAME.state.score3++;
  } else {
    audio.playSFX('click');
  }

  if (epNum === 1) {
    GAME.state.score1 += choice.primaryDelta;
    GAME.state.score2 = Math.max(0, Math.min(100, GAME.state.score2 + choice.secDelta));
    GAME.state.score3 = Math.max(0, Math.min(100, GAME.state.score3 + choice.hubDelta));
  } else {
    GAME.state.score1 = Math.max(0, Math.min(100, GAME.state.score1 + choice.primaryDelta));
    GAME.state.score2 = Math.max(0, Math.min(100, GAME.state.score2 + choice.secDelta));
  }

  GAME.state.history.push({
    title: sc.title,
    chosenLabel: choice.label,
    outcomeText: choice.text,
    desc: choice.desc
  });

  $('#app').innerHTML = `
    ${renderHUD()}
    <div class="card">
      <h3>Hasil Keputusan ${EPISODES[epNum].hero}</h3>
      <p style="font-size:1.05rem;color:var(--accent-amber);margin:14px 0">"${choice.text}"</p>

      <table class="ledger-table">
        <tr><th>Parameter Etika</th><th>Dampak</th></tr>
        <tr><td>${epNum === 1 ? 'Dampak Net Utilitas ($U$)' : 'Skor Kewajiban ($D$)'}</td><td>${choice.primaryDelta > 0 ? '+' : ''}${choice.primaryDelta}</td></tr>
        <tr><td>${epNum === 1 ? 'Kesejahteraan Warga' : 'Kebenaran Mutlak'}</td><td>${choice.secDelta > 0 ? '+' : ''}${choice.secDelta}%</td></tr>
      </table>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-top:8px"><i>Catatan Prinsip: ${choice.desc}</i></p>

      <button class="primary" onclick="audio.playSFX('click'); nextScenario()" style="margin-top:16px;width:100%">
        ${GAME.state.index + 1 < 5 ? "Lanjut ke Kasus Berikutnya" : "Lihat Keputusan Akhir"}
      </button>
    </div>
  `;
}

function nextScenario() {
  GAME.state.index++;
  GAME.state.inspectionsDone = [];
  GAME.state.dialogueHistory = [];

  if (GAME.state.index < 5) {
    renderScenario();
  } else {
    renderSummary();
  }
}

function renderSummary() {
  const s = GAME.state;
  const epNum = GAME.currentEp;
  let assetEnding = "";
  let titleEnding = "";
  let evalText = "";

  if (epNum === 1) {
    if (s.score1 >= 120) {
      assetEnding = "ending_ep1_high";
      titleEnding = "Utilitaris Sejati — Kebaikan Kolektif Maksimal";
      evalText = "Laila berhasil mengambil keputusan rasional demi kesejahteraan sebagian besar warga. Pemukiman warga secara keseluruhan tumbuh dan selamat dari krisis.";
    } else if (s.score1 >= 40) {
      assetEnding = "ending_ep1_mid";
      titleEnding = "Pemimpin Kompromis — Keseimbangan Rentan";
      evalText = "Laila berusaha menyeimbangkan antara aturan utilitas dan perasaan pribadi. Hasilnya cukup stabil bagi warga.";
    } else {
      assetEnding = "ending_ep1_low";
      titleEnding = "Pilihan Emosional — Kegagalan Utilitas";
      evalText = "Keputusan Laila lebih banyak didorong oleh rasa kasihan dan ikatan pribadi. Sebagian besar warga mengalami dampak krisis.";
    }
  } else {
    if (s.score3 >= 3) {
      assetEnding = "ending_ep2_corrupt";
      titleEnding = "ENDING 3: INGATAN KERAPUHAN (Dampak Keraguan)";
      evalText = "Akibat keraguan Marcella yang berlarut-larut, sinyal gelombang memori mengalami overload. Ingatan Rani terdistorsi dan terfragmentasi. Rani lupa nama saudarinya, namun penderitaan emosionalnya tetap menghantuinya.";
    } else if (s.score1 >= 60) {
      assetEnding = "ending_ep2_deon";
      titleEnding = "ENDING 1: PENJAGA KEBENARAN MUTLAK (Deontologi Sejati)";
      evalText = "Marcella menaati Sumpah Juru Lupa dan Hukum Kota Sumbra secara mutlak. Permohonan Rani ditolak. Kebenaran tewasnya Rina tetap utuh di dalam sejarah kota.";
    } else {
      assetEnding = "ending_ep2_mercy";
      titleEnding = "ENDING 2: BELAS KASIH YANG MENGAPUS SEJARAH (Pelanggaran Tugas)";
      evalText = "Marcella melanggar sumpah profesinya demi belas kasih. Rani tenang tanpa beban ingatan jembatan, namun kebenaran tewasnya Rina terhapus selamanya dari dunia.";
    }
  }

  $('#app').innerHTML = `
    <div class="card">
      ${renderArt(assetEnding, titleEnding)}
      <h2>Akhir Episode ${epNum}: Audit Keputusan</h2>
      <h3 style="color:var(--ep-color)">${titleEnding}</h3>
      <p style="margin:12px 0">${evalText}</p>

      <div style="background:rgba(0,0,0,0.4);padding:14px;border-radius:8px;margin:16px 0">
        ${epNum === 1 ? `
          <p><b>Total Skor Utilitas ($U$):</b> ${s.score1} U</p>
          <p><b>Kesejahteraan Warga:</b> ${s.score2}%</p>
          <p><b>Hubungan Personal Laila:</b> ${s.score3}%</p>
        ` : `
          <p><b>Skor Kewajiban ($D$):</b> ${s.score1}%</p>
          <p><b>Kebenaran Mutlak:</b> ${s.score2}%</p>
          <p><b>Tingkat Keraguan Marcella:</b> ${s.score3} kali</p>
        `}
      </div>

      <h4>Rekapitulasi Tindakan ${EPISODES[epNum].hero}:</h4>
      <table class="ledger-table">
        <tr><th>Tahap</th><th>Pilihan</th></tr>
        ${s.history.map(h => `
          <tr>
            <td>${h.title}</td>
            <td>${h.chosenLabel}</td>
          </tr>
        `).join('')}
      </table>

      <div class="btn-group" style="margin-top:20px">
        <button class="primary" onclick="audio.playSFX('click'); startEpisode(${epNum})">Ulangi Episode ${epNum}</button>
        <button onclick="audio.playSFX('click'); renderTitle()">Kembali ke Menu Utama</button>
      </div>
    </div>
  `;
}

window.onload = init;
</script>
